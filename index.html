
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> piyush Auto Translator</title>
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background-color: white;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            width: 100%;
            max-width: 800px; /* Thoda bada kiya takia side-by-side mast dikhe */
        }

        h2 {
            text-align: center;
            color: #333;
            margin-bottom: 25px;
            font-weight: 600;
        }

        /* Responsive Grid for Side-by-Side look */
        .translator-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        @media (max-width: 650px) {
            .translator-grid {
                grid-template-columns: 1fr; /* Mobile me ek ke niche ek aayega */
            }
        }

        .box {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        /* Language Selector Styling */
        select {
            padding: 10px 15px;
            font-size: 15px;
            border: 1px solid #ddd;
            border-radius: 8px;
            background-color: #fff;
            outline: none;
            cursor: pointer;
            color: #444;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        select:focus {
            border-color: #007bff;
        }

        textarea {
            width: 100%;
            height: 180px;
            padding: 15px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
            resize: none;
            outline: none;
            transition: all 0.3s ease;
        }

        textarea:focus {
            border-color: #007bff;
            box-shadow: 0 0 5px rgba(0, 123, 255, 0.2);
        }

        #targetText {
            background-color: #f8f9fa;
            color: #222;
        }
        
        .status {
            text-align: right;
            font-size: 13px;
            color: #007bff;
            height: 20px;
            margin-top: 10px;
            font-weight: 500;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Piyush  Auto Translator</h2>
        
        <div class="translator-grid">
            <!-- Left Box: Source Language -->
            <div class="box">
                <select id="fromLang">
                    <option value="en">English</option>
                    <option value="hi">Hindi (हिंदी)</option>
                    <option value="es">Spanish (Español)</option>
                    <option value="fr">French (Français)</option>
                    <option value="de">German (Deutsch)</option>
                    <option value="ar">Arabic (العربية)</option>
                    <option value="ru">Russian (Русский)</option>
                    <option value="zh">Chinese (中文)</option>
                    <option value="bn">Bengali (বাংলা)</option>
                    <option value="mr">Marathi (मराठी)</option>
                    <option value="te">Telugu (తెలుగు)</option>
                    <option value="ta">Tamil (தமிழ்)</option>
                    <option value="gu">Gujarati (ગુજરાતી)</option>
                    <option value="ur">Urdu (اردو)</option>
                </select>
                <textarea id="sourceText" placeholder="Kuch bhi type karein..."></textarea>
            </div>
            
            <!-- Right Box: Target Language -->
            <div class="box">
                <select id="toLang">
                    <option value="hi" selected>Hindi (हिंदी)</option>
                    <option value="en">English</option>
                    <option value="es">Spanish (Español)</option>
                    <option value="fr">French (Français)</option>
                    <option value="de">German (Deutsch)</option>
                    <option value="ar">Arabic (العربية)</option>
                    <option value="ru">Russian (Русский)</option>
                    <option value="zh">Chinese (中文)</option>
                    <option value="bn">Bengali (বাংলা)</option>
                    <option value="mr">Marathi (मराठी)</option>
                    <option value="te">Telugu (తెలుగు)</option>
                    <option value="ta">Tamil (தமிழ்)</option>
                    <option value="gu">Gujarati (ગુજરાતી)</option>
                    <option value="ur">Urdu (اردو)</option>
                </select>
                <textarea id="targetText" placeholder="Translation yahan dikhega..." readonly></textarea>
            </div>
        </div>

        <!-- Live Status -->
        <div class="status" id="statusText"></div>
    </div>

    <script>
        const sourceText = document.getElementById('sourceText');
        const targetText = document.getElementById('targetText');
        const fromLang = document.getElementById('fromLang');
        const toLang = document.getElementById('toLang');
        const statusText = document.getElementById('statusText');
        
        let timeout = null;

        // Main Translation Function
        function performTranslation() {
            let text = sourceText.value.trim();
            
            if (!text) {
                targetText.value = "";
                statusText.innerText = "";
                return;
            }

            statusText.innerText = "Translating...";

            // Dono select boxes se language codes lena (e.g. en|hi, hi|es)
            let langPair = `${fromLang.value}|${toLang.value}`;
            let apiUrl = `https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=${langPair}`;

            fetch(apiUrl)
                .then(res => res.json())
                .then(data => {
                    if(data.responseData) {
                        targetText.value = data.responseData.translatedText;
                        statusText.innerText = "Done!";
                    } else {
                        statusText.innerText = "Translation limit reached or error!";
                    }
                })
                .catch(error => {
                    targetText.value = "Internet connection check karein!";
                    console.error("Error:", error);
                    statusText.innerText = "Error!";
                });
        }

        // 1. Jab user type karega (Debounce logic ke saath)
        sourceText.addEventListener('input', () => {
            clearTimeout(timeout);
            statusText.innerText = "Typing...";
            timeout = setTimeout(performTranslation, 800); // 0.8 sec rukne par automatic translate
        });

        // 2. Jab user "From Language" badlega
        fromLang.addEventListener('change', performTranslation);

        // 3. Jab user "To Language" badlega
        toLang.addEventListener('change', performTranslation);
    </script>
</body>
</html>
